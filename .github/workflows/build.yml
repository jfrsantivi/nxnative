name: Build Zelda IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install gdown

    - name: Download NSP files from Google Drive
      run: |
        mkdir -p ~/Documents/Games/Zelda
        # Descargar el ZIP desde Google Drive
        gdown https://drive.google.com/uc?id=1C3Rqn9upZ16qLISSJeyyaNUOxT0vb6xz -O ~/Documents/Games/Zelda/game_files.zip

        # Extraer los NSP
        cd ~/Documents/Games/Zelda
        if [ -f game_files.zip ]; then
          unzip -o game_files.zip
          rm game_files.zip
        fi

    - name: Setup prod.keys
      run: |
        mkdir -p ~/.keys
        echo "${{ secrets.PROD_KEYS }}" > ~/.keys/prod.keys

    - name: Run IPA Build
      run: |
        python3 scripts/build_ipa_from_nsp.py ~/Documents/Games/Zelda -k ~/.keys/prod.keys --update-lock

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zelda-IPA
        path: build/*.ipa
