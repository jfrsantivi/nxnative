name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 capstone fonttools

      - name: Create prod.keys file
        run: |
          mkdir -p ~/.keys
          echo "${{ secrets.PROD_KEYS }}" > ~/.keys/prod.keys

      - name: Run IPA Build
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Documents/Games/Zelda -k ~/.keys/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zelda-IPA
          path: ~/Documents/Games/Zelda/*.ipa
