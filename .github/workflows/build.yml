name: Build Zelda IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Download NSP files from GoFile
      run: |
        mkdir -p ~/Documents/Games/Zelda
        cd ~/Documents/Games/Zelda

        # Obtener el enlace directo del archivo desde la API de GoFile
        FILE_URL=$(curl -s "https://api.gofile.io/contents/3IEppXUV?wt=41d63d4ae120" | python3 -c "import sys, json; data=json.load(sys.stdin); print(list(data['data']['children'].values())[0]['link'])")

        # Descargar el ZIP
        curl -L -o game_files.zip "$FILE_URL"

        # Extraer los NSP
        if [ -f game_files.zip ]; then
          unzip -o game_files.zip
          rm game_files.zip
        fi

    - name: Setup prod.keys
      run: |
        mkdir -p ~/.keys
        echo "${{ secrets.PROD_KEYS }}" > ~/.keys/prod.keys

    - name: Run IPA Build
      run: |
        python3 scripts/build_ipa_from_nsp.py ~/Documents/Games/Zelda -k ~/.keys/prod.keys

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zelda-IPA
        path: build/*.ipa
