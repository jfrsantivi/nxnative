name: Build Zelda IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        brew install xcodegen spirv-cross

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install huggingface_hub lz4 capstone fonttools

    - name: Download NSP files from Hugging Face
      run: |
        mkdir -p ~/Documents/Games/Zelda
        # Descargar el ZIP usando tu repositorio de Hugging Face
        python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='Jfrsantivi/misjuegos', filename='Hyrule Warriors Age of Calamity [Guardian of Remembrance][01002B00111A3004].ZIP', repo_type='dataset', local_dir='/Users/runner/Documents/Games/Zelda')"

        # Renombrar y extraer los NSP
        cd ~/Documents/Games/Zelda
        mv 'Hyrule Warriors Age of Calamity [Guardian of Remembrance][01002B00111A3004].ZIP' game_files.zip
        if [ -f game_files.zip ]; then
          unzip -o game_files.zip
          rm game_files.zip
        fi

    - name: Setup prod.keys
      run: |
        mkdir -p ~/.keys
        echo "${{ secrets.PROD_KEYS }}" > ~/.keys/prod.keys

    - name: Run IPA Build
      run: |
        # Actualizar el lockfile de la cadena de traducción de shaders a la versión actual de macOS/brew
        python3 scripts/dmsh_chain.py --update-lock
        # Ejecutar la compilación limpia de la IPA
        python3 scripts/build_ipa_from_nsp.py ~/Documents/Games/Zelda -k ~/.keys/prod.keys

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zelda-IPA
        path: build/*.ipa
